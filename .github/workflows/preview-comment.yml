# Comment the Worker Preview URL on every PR.
#
# Workers Builds creates the preview (`pnpm deploy:preview` =
# `vinext-cloudflare previews deploy`, see DEPLOYMENT.md) but its PR comment
# only links the build log — it lists preview URLs for `wrangler preview`
# builds, not `cf previews deploy`. The preview URL is deterministic from the
# branch name (non-alphanumerics become "-"), so once the Workers Builds check
# succeeds this job verifies the URL answers and posts/updates one comment.
name: preview-comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: preview-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    # Forked PRs get a read-only token and no Workers Builds preview anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for the Workers Builds preview, then comment its URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail

          # Wait up to ~20 min for the Workers Builds check on this commit.
          result=""
          for _ in $(seq 1 80); do
            result=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("Workers Builds"))][0] | "\(.status) \(.conclusion)"' \
              2>/dev/null || true)
            case "$result" in
              "completed success") break ;;
              completed*) echo "::warning::Workers Builds did not succeed ($result); no preview comment."; exit 0 ;;
            esac
            sleep 15
          done
          if [ "$result" != "completed success" ]; then
            echo "::warning::Timed out waiting for Workers Builds; no preview comment."
            exit 0
          fi

          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' |
            sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          urls=(
            "https://${slug}.preview.favorcare.media"
            "https://${slug}-favorcare-org.favor-care-media-team.workers.dev"
          )

          # Only link URLs that answer (DNS/TLS for a new preview can lag).
          live=()
          for url in "${urls[@]}"; do
            if curl -fsS -o /dev/null --retry 6 --retry-delay 10 --retry-all-errors "$url"; then
              live+=("$url")
            fi
          done
          if [ "${#live[@]}" -eq 0 ]; then
            echo "::warning::No preview URL answered for branch $BRANCH."
            exit 0
          fi

          marker='<!-- favorcare-preview -->'
          body="$marker"$'\n'"### 🔎 Preview ready"$'\n\n'
          for url in "${live[@]}"; do body+="- <$url>"$'\n'; done
          body+=$'\n'"Commit \`${SHA:0:7}\` · Worker Preview \`${BRANCH}\` (production is untouched)."

          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
