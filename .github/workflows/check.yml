# CI check for every PR: format + lint + typecheck + unit tests + build.
# (Deployment is a separate step — see DEPLOYMENT.md.)
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (prettier, oxlint, tsc)
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
